<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Sections - NRS Tax Tracking System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="bill-sections">
  <nav class="navbar"></nav>

  <section class="hero" style="padding:3rem 24px;">
    <h1>📜 NRS Bill Sections</h1>
    <p>Browse, search, and explore all sections of the Nigeria Revenue Service (NRS) tax laws and regulations.</p>
  </section>

  <div class="container">
    <div class="bill-container">
      <div class="bill-filters">
        <input type="text" id="searchInput" placeholder="Search bill sections..." oninput="filterBills()">
        <select id="categoryFilter" onchange="filterBills()">
          <option value="all">All Categories</option>
        </select>
      </div>
      <div id="billsContainer">
        <div class="loading"><div class="spinner"></div><p>Loading bill sections...</p></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p><strong>NIGERIA REVENUE SERVICE (NRS) - Tax Tracking System</strong></p>
    <p>© 2026 - Built for Educational Purposes</p>
  </footer>

  <script src="js/main.js"></script>
  <script>
    let allBills = [], allCategories = [];

    async function loadBills() {
      try {
        const res = await fetch('/api/bills');
        allBills = await res.json();
        renderBills(allBills);
        loadCategories();
      } catch {
        document.getElementById('billsContainer').innerHTML = '<div class="alert alert-danger">❌ Failed to load bill sections.</div>';
      }
    }

    async function loadCategories() {
      try {
        const res = await fetch('/api/bills/categories/all');
        allCategories = await res.json();
        const select = document.getElementById('categoryFilter');
        allCategories.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c; opt.textContent = c;
          select.appendChild(opt);
        });
      } catch {}
    }

    function renderBills(bills) {
      const container = document.getElementById('billsContainer');
      if (!bills.length) { container.innerHTML = '<div class="alert alert-warning">⚠️ No bill sections found.</div>'; return; }
      container.innerHTML = bills.map(b => `
        <div class="bill-item">
          <div class="bill-item-header">
            <h3>${b.title}</h3>
            <div>
              <span class="bill-section-number">${b.section_number}</span>
              <span class="bill-category">${b.category}</span>
            </div>
          </div>
          <p>${b.content}</p>
        </div>
      `).join('');
    }

    function filterBills() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;
      renderBills(allBills.filter(b =>
        (!search || b.title.toLowerCase().includes(search) || b.content.toLowerCase().includes(search)) &&
        (category === 'all' || b.category === category)
      ));
    }

    document.addEventListener('DOMContentLoaded', loadBills);
  </script>
</body>
</html>
