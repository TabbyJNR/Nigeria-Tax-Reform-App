<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback - NRS Tax Tracking System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="feedback">
  <nav class="navbar"></nav>

  <section class="hero" style="padding:3rem 24px;">
    <h1>💬 Public Feedback</h1>
    <p>Share your opinions and suggestions on the Nigeria Revenue Service (NRS) tax system.</p>
  </section>

  <div class="container">
    <div class="feedback-grid">
      <div class="feedback-form-card">
        <h3 style="margin-bottom:1.2rem; color:#111827; font-size:1.05rem;">Submit Feedback</h3>
        <div id="alertContainer"></div>
        <div class="form-group">
          <label>Subject</label>
          <input type="text" id="subject" placeholder="Enter subject">
        </div>
        <div class="form-group">
          <label>Your Message</label>
          <textarea id="message" placeholder="Share your thoughts on the tax system..."></textarea>
        </div>
        <button class="btn-calculate" onclick="submitFeedback()">Submit Feedback</button>
      </div>

      <div class="feedback-list-card">
        <h3 style="margin-bottom:1.2rem; color:#111827; font-size:1.05rem;">Recent Feedback</h3>
        <div id="feedbackList">
          <div class="loading"><div class="spinner"></div><p>Loading feedback...</p></div>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p><strong>NIGERIA REVENUE SERVICE (NRS) - Tax Tracking System</strong></p>
    <p>© 2026 - Built for Educational Purposes</p>
  </footer>

  <script src="js/main.js"></script>
  <script>
    async function submitFeedback() {
      const token = localStorage.getItem('token');
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      const subject = document.getElementById('subject').value.trim();
      const message = document.getElementById('message').value.trim();
      if (!subject || !message) { showAlert('Please fill in all fields.', 'warning'); return; }

      try {
        const res = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subject, message, userId: user.id || null, userName: user.fullname || 'Anonymous' })
        });
        const data = await res.json();
        if (res.ok) {
          showAlert('Feedback submitted successfully!', 'success');
          document.getElementById('subject').value = '';
          document.getElementById('message').value = '';
          loadFeedback();
        } else { showAlert(data.message || 'Failed to submit.', 'danger'); }
      } catch { showAlert('Network error. Please try again.', 'danger'); }
    }

    async function loadFeedback() {
      try {
        const res = await fetch('/api/feedback');
        const feedbacks = await res.json();
        const container = document.getElementById('feedbackList');
        if (!feedbacks.length) { container.innerHTML = '<p style="color:#6B7280;">No feedback yet. Be the first!</p>'; return; }
        container.innerHTML = feedbacks.slice(0, 10).map(fb => `
          <div class="feedback-item">
            <div class="feedback-item-header">
              <span style="color:#006B3F; font-weight:600;">${fb.user_name || 'Anonymous'}</span>
              <span style="color:#6B7280;">${new Date(fb.created_at).toLocaleDateString()}</span>
            </div>
            <div class="subject">${fb.subject}</div>
            <div class="message">${fb.message}</div>
          </div>
        `).join('');
      } catch {
        document.getElementById('feedbackList').innerHTML = '<div class="alert alert-danger">❌ Failed to load feedback.</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadFeedback);
  </script>
</body>
</html>
