<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - NRS Tax Tracking System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
  <nav class="navbar"></nav>

  <div class="container">
    <div class="auth-container">
      <div class="auth-card">
        <h2>Create Account</h2>
        <p class="subtitle">Register to access NRS tax services</p>
        <div id="alertContainer"></div>
        <form id="registerForm">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="fullname" placeholder="Enter your full name" required>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Minimum 6 characters" required>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat your password" required>
          </div>
          <button type="submit" class="btn-calculate">Create Account</button>
        </form>
        <div class="auth-footer">
          Already have an account? <a href="login.html">Login here</a>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p><strong>NIGERIA REVENUE SERVICE (NRS) - Tax Tracking System</strong></p>
    <p>© 2026 - Built for Educational Purposes</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
