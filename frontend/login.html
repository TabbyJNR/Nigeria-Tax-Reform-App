<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NRS Tax Tracking System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <nav class="navbar"></nav>

  <div class="container">
    <div class="auth-container">
      <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to access your NRS account</p>
        <div id="alertContainer"></div>
        <form id="loginForm">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn-calculate">Login</button>
        </form>
        <div class="auth-footer">
          Don't have an account? <a href="register.html">Register here</a>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p><strong>NIGERIA REVENUE SERVICE (NRS) - Tax Tracking System</strong></p>
    <p>© 2026 - Built for Educational Purposes</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
